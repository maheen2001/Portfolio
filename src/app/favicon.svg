<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="logo_gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#ec4899" />
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="15" result="coloredBlur" />
            <feMerge>
                <feMergeNode in="coloredBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    
    <!-- Background Circle (Optional, for app icon usage) -->
    <!-- <circle cx="256" cy="256" r="240" fill="#12121a" /> -->

    <!-- Monogram M -->
    <path 
        d="M100 400V120L256 276L412 120V400" 
        stroke="url(#logo_gradient)" 
        stroke-width="64" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"
    />
</svg>
